url: https://atnt.github.io/spatialcovariates/

# template:
#   bootstrap: 5
#   bootswatch: cosmo
template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: yes
  bslib:
    primary: '#C9B7A8'
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: '#004C34'
    base_font:
      google: Roboto
    heading_font:
      google: Roboto
    code_font:
      google: JetBrains Mono

home:
  title: Automated Covariate Fetching for Plot2Map
  description: >
    Fetch, process, and stack environmental covariates for forest biomass mapping
    and bias modeling workflows.

navbar:
  structure:
    left: [home, reference, news]
    right: [github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/aTnT/spatialcovariates

# Reference section will auto-discover exported functions
# Manual grouping can be added after man/ files are generated

footer:
  structure:
    left: developed_by
    right: built_with
